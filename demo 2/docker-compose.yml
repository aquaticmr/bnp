version: '3.8'

services:
  # 1. PostgreSQL (Relational Data & Versioning)
  postgres:
    image: postgres:15-alpine
    container_name: reg-iris-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: regiris
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # 2. MinIO (Raw File Storage)
  minio:
#    image: minio/minio:latest
    image: pgsty/minio:latest
    container_name: reg-iris-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Web UI Console port
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # 3. Elasticsearch (BM-25 Keyword Search)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: reg-iris-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # Disabled for local dev ease
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  # 4. ChromaDB (Semantic Vector Store)
#  chromadb:
#    image: chromadb/chroma:latest
#    container_name: reg-iris-chromadb
#    environment:
#      - IS_PERSISTENT=TRUE
#    ports:
#      - "8000:8000"
#    volumes:
#      - chroma_data:/chroma/chroma
#    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: reg-iris-chromadb
    environment:
      - IS_PERSISTENT=TRUE
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped


volumes:
  postgres_data:
  minio_data:
  elastic_data:
  chroma_data: