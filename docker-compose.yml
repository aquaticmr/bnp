version: '3.8'

services:
  # 1. PostgreSQL (Relational Data & Versioning)
  postgres:
    image: postgres:15-alpine
    container_name: reg-iris-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: regiris
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d regiris"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. MinIO (Raw File Storage)
  minio:
    image: pgsty/minio:latest
    container_name: reg-iris-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # 3. Elasticsearch (BM-25 Keyword Search)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: reg-iris-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. ChromaDB (Semantic Vector Store)
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: reg-iris-chromadb
    environment:
      - IS_PERSISTENT=TRUE
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  # 5. FastAPI Core Intelligence Service (Search, RAG, Rules & Engine)
  core-service:
    build:
      context: ./core_service
      dockerfile: Dockerfile
    container_name: reg-iris-core-service
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/regiris
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  elastic_data:
  chroma_data:
